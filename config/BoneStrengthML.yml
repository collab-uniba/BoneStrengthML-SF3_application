  outputs:
    - name: maxStrain_11
      data_type: float
      range: [0, 0.001]
      units: adimensional
      missing_values_allowed: false
    - name: maxStrain_33
      data_type: float
      range: [0, 0.03]
      units: adimensional
      missing_values_allowed: false
  duplicate_rows: false


gate_thresholds:
  validation:
    - field: maxStrain_11  # Check che sia uno degli output?
      metric: MaximumAbsoluteError  # Oppure InfinityNorm, qui dobbiamo decidere un dizionario di metriche ammissibili (RMSE, PercentageRMSE, ecc.)
      value: 0.000051
    - field: maxStrain_33
      metric: MaximumAbsoluteError
      value: 0.000073

  verification:
    convergence:
      - field: maxStrain_11
        metric: MeanRelativeError
        value: 0.05
      - field: maxStrain_33
        metric: MeanRelativeError
        value: 0.05
    smoothness:
      - field: maxStrain_11
        metric: MaximumRelativeErrorRatio
        value: 1
      - field: maxStrain_11
        metric: MaximumRelativeErrorRatio
        value: 1
    numerical_error:
      - field: maxStrain_11
        metric: StandardDeviation
        value: 0.0000051
      - field: maxStrain_33
        metric: StandardDeviation
        value: 0.0000073


test_configurations:
  verification:
    convergence:
      n_rows: [100, 250, 500, 1000]  # Forse anche questo ha senso farlo relativo invece che assoluto (o poter scegliere)?
    existence:
      samples: 1000000
    smoothness:
      sample_fraction: 0.4
      perturbation_scaled_magnitude: 0.001
    numerical_error:
      sets: 10



model_development:
  train_test_split:
    train_fraction: 0.7
    method: random

  preprocessing:
    normalization: false  # Definire dizionario (su ogni campo di input? Può variare per i vari modelli testati?)
    standardization: false # Definire dizionario (come sopra)

  optimization:
    feature_selection: null  # Anche qui metterei un dizionario con i metodi possibili (ed eventuali campi ulteriori per parametri del feature selector; può variare per i diversi modelli?)
    optimization_method: GridSearch  # Uguale per tutti i modelli?
    n_jobs: -1
    cv: 5
    scoring: null

  model_list:
    - type: RandomForestRegressor  # Definire dizionario
      optimization:
        feature_selection: null
        optimization_method: RandomizedSearchCV
        n_jobs: -1
        cv: 5
      hyperparameters:
        criterion: squared_error
        n_estimators: [50, 500]
        max_depth: [3, 30]
        min_samples_split: [2, 10]
        min_samples_leaf: [1, 5]
    - type: XGBoostRegressor
      optimization:
        optimization_method: RandomizedSearchCV
        n_jobs: -1
        cv: 5
      hyperparameters:
        objective: reg:squarederror
        n_estimators: [100, 600]
        max_depth: [3, 12]
        learning_rate: [0.01, 0.3]
        subsample: [0.5, 1.0]
        colsample_bytree: [0.5, 1.0]
    - type: SupportVectorRegressor
      hyperparameters:
        C: [0.1, 10.0]
        epsilon: [0.01, 0.5]
        gamma: [scale, auto]
        kernel: rbf
    - label: Bar
      type: LinearRegressor
      hyperparameters:
        fit_intercept: true
    - type: MLPRegressor
      hyperparameters:
        hidden_layer_sizes: [[50,], [100,], [50, 50]]
        activation: [relu, tanh]
        alpha: [0.0001, 0.01]
        learning_rate_init: [0.001, 0.01]
        max_iter: 2000
