[project]
name = "bonestrengthml-sf3-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.8",
    "mlflow>=2.10.0",
    "nbformat>=5.10.4",
    "pandas>=2.0",
    "pandera>=0.20",
    "prefect>=3.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
    "typer>=0.12.0",
    "xgboost>=3.1.3",
]

[project.scripts]
bonestrength-train = "bonestrength_ml.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["bonestrength_ml*"]
